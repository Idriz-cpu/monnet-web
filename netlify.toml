# Netlify veröffentlicht nur die Aktions-Landingpage (Ordner aktion/), nicht die Astro-Webseite.
# Die Funktionen in netlify/functions erstellen aus jeder Anfrage einen Angebotsentwurf (siehe netlify/README.md).
[build]
  publish = "aktion"
  command = "echo 'Statische Seite, kein Build nötig'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/fr"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/fr/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en/"
  to = "/index.html"
  status = 200
